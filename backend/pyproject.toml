[project]
name = "contentfactory-backend"
version = "0.1.0"
description = "ContentFactory API, domain logic and background workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "cryptography>=43",
  "redis>=5.2",
  "arq>=0.26",
  "httpx>=0.27",
  "boto3>=1.35",
  "pillow>=11",
]

[project.optional-dependencies]
dev = ["moto[s3]>=5.0", "pytest>=8.3", "pytest-asyncio>=0.24", "fakeredis>=2.26", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML email markup reads better unwrapped.
"app/notifications/email/templates.py" = ["E501"]
# Fixed test/demo credentials, seeded RNG for reproducible demo data, alembic subprocess in tests.
"tests/**" = ["S105", "S106", "S603", "S607"]
"scripts/**" = ["S105", "S311"]

[tool.ruff.lint.isort]
# The local alembic/ folder shadows the package name; treat the import as third-party.
known-third-party = ["alembic"]
known-first-party = ["app", "tests", "scripts"]
